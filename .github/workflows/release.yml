name: Release

# When a release is published, attach the card file to it. HACS then
# installs from the release, and GitHub counts each download.
# It can also be run by hand (Actions -> Release -> Run workflow) to attach
# the file to a release that's already published.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the card file to (e.g. 0.9.4)"
        required: true

permissions:
  contents: write

jobs:
  attach-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the card version matches the tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          FILE=home-power-flow-card.js; [ -f "$FILE" ] || FILE=dist/home-power-flow-card.js
          V="${TAG#v}"
          grep -q "const VERSION = '$V';" "$FILE" || { echo "VERSION in $FILE does not match tag $TAG"; exit 1; }

      - name: Attach home-power-flow-card.js to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -f home-power-flow-card.js ]; then FILE=home-power-flow-card.js
          elif [ -f dist/home-power-flow-card.js ]; then FILE=dist/home-power-flow-card.js
          else echo "home-power-flow-card.js not found" && exit 1; fi
          gh release upload "$TAG" "$FILE" --clobber
