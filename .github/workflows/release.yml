name: Release

# When a release is published, attach the card file to it. HACS then
# installs from the release, and GitHub counts each download.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attach home-power-flow-card.js to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" home-power-flow-card.js --clobber
